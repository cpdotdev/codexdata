version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    # Major bumps of the test/type toolchain are handled by hand: vitest and
    # @cloudflare/vitest-pool-workers must move together, and TypeScript majors
    # need a look at the emitted types.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
