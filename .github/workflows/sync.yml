name: Sync official Codex catalog

# External sync agent. Cloudflare Workers egress to chatgpt.com is blocked, so a GitHub-hosted
# runner does the fetch: it leases a short-lived access token from the Worker (10-minute lease),
# fetches the official catalog, and pushes the raw response back for validation and publishing.
# The refresh token never leaves the Worker.
on:
  schedule:
    - cron: "7 * * * *" # hourly at :07 UTC; the Worker refreshes the token only when it is about to expire
  workflow_dispatch:

permissions:
  contents: read

# One sync at a time. The Worker-side lease is the second guard.
concurrency:
  group: codexdata-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The catalog signing key lives only in the `catalog-signing` environment, whose deployment
    # branch rule admits only `main`, so pull request workflows cannot read it
    # (docs/RUNBOOK.md#catalog-signing). The `if` is a second guard: a dispatch on another branch
    # skips the job instead of failing on the environment rule.
    if: github.ref == 'refs/heads/main'
    environment: catalog-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lease token, fetch catalog, ingest
        env:
          CODEXDATA_ORIGIN: ${{ vars.CODEXDATA_ORIGIN || 'https://data.cp.dev' }}
          CODEXDATA_ADMIN_TOKEN: ${{ secrets.CODEXDATA_ADMIN_TOKEN }}
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: node scripts/sync-agent.mjs
