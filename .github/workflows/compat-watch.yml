name: Compat watch

# Watches Codex CLI releases. Every 6 hours it compares the npm dist-tags (latest / alpha) with
# the probes already committed; for each new version it downloads the official binary and runs
# scripts/compat-probe.mjs. A regression (a managed key vanished from the binary, or a
# Codex-Pass-shaped config.toml is rejected as a whole) opens an `ops` issue for human triage; the
# verdict goes into data/codex-compat/tracked.json (statusOverride/action) or advisories/.
#
# Three jobs, so that nothing that runs third-party code can change what runs with a key
# (docs/DATA-SIGNING.md):
#   probe    runs pnpm install and the downloaded binaries with a read-only token; it hands over
#            its data changes as a patch;
#   commit   runs no third-party code; it applies the patch only if it touches nothing but the
#            probe files and the compat payload (scripts/apply-data-patch.mjs), then pushes to main;
#   publish  signs the committed payload with the data-signing key and hot-publishes it to
#            data.cp.dev (KV; no Worker redeploy).
on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Probe only this Codex version (empty = npm dist-tags latest + alpha)"
        required: false
      force:
        description: "Re-probe even if already probed (true/false)"
        required: false
        default: "false"
      publish:
        description: "Publish the committed compat payload even without new probe data (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: codexdata-compat-watch
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Probe new Codex versions
        id: probe
        env:
          VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          [ -n "$VERSION" ] && args+=(--version "$VERSION")
          [ "$FORCE" = "true" ] && args+=(--force)
          set +e
          node scripts/compat-probe.mjs "${args[@]}" | tee probe.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # 0 = nothing new or all clear; 20 = regression found (still commit + publish so clients see the facts).
          [ "$status" = "0" ] || [ "$status" = "20" ] || exit "$status"
      - name: Rebuild compat payload
        run: node scripts/build-compat.mjs
      - name: Format probe data
        run: pnpm exec prettier --write data/codex-compat/probes
      - name: Collect the data changes as a patch
        id: diff
        run: |
          git add data/codex-compat/probes public/v1/compat
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no new probe data"
          else
            git diff --cached --binary > "$RUNNER_TEMP/compat.patch"
            git diff --cached --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.diff.outputs.changed == 'true'
        with:
          name: compat-patch
          path: ${{ runner.temp }}/compat.patch
          retention-days: 3
      - name: Open or update regression issue
        if: steps.probe.outputs.status == '20'
        run: |
          title="Codex compat regression detected"
          body=$(printf 'compat-probe found regressions at %s.\n\n```\n%s\n```\n\nTriage: confirm in data/codex-compat/tracked.json (statusOverride/action) or add an advisory, then re-run build-compat + publish.\n' \
            "$(date -u +%FT%TZ)" "$(grep -E 'probing|wrote|!!' probe.log | head -40)")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label "ops"
          fi

  # Holds the write token and runs no third-party code: checkout, the artifact download and
  # Node built-ins. `!cancelled()`: probe data that was collected is committed even if the probe
  # job failed later (for example while opening the regression issue).
  commit:
    needs: probe
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.probe.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compat-patch
          path: ${{ runner.temp }}/patch
      - name: Apply the data-only patch
        run: |
          node scripts/apply-data-patch.mjs "$RUNNER_TEMP/patch/compat.patch" \
            data/codex-compat/probes/ public/v1/compat/codex/latest.json
      - name: Commit and push
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(compat): probe new Codex versions"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Signs and publishes the committed compat payload (docs/DATA-SIGNING.md). The signing key lives
  # only in the `data-signing` environment (deployment branch rule: `main`). This job runs no
  # third-party code either. The scripts come from the commit this run started on; only the payload
  # bytes are read from the pushed commit, and only after checking that it is on main.
  publish:
    needs: [probe, commit]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.commit.outputs.sha != '' || inputs.publish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: data-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Take the payload from the published commit
        env:
          SHA: ${{ needs.commit.outputs.sha || github.sha }}
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "$SHA is not on main"; exit 1; }
          git show "$SHA:public/v1/compat/codex/latest.json" > "$RUNNER_TEMP/compat-latest.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
      - name: Sign and publish to data.cp.dev (KV hot update)
        env:
          CODEXDATA_ORIGIN: ${{ vars.CODEXDATA_ORIGIN || 'https://data.cp.dev' }}
          CODEXDATA_ADMIN_TOKEN: ${{ secrets.CODEXDATA_ADMIN_TOKEN }}
          DATA_SIGNING_KEY: ${{ secrets.DATA_SIGNING_KEY }}
        run: node scripts/publish-compat.mjs "$RUNNER_TEMP/compat-latest.json"
