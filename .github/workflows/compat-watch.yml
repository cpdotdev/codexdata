name: Compat watch

# Watches Codex CLI releases. Every 6 hours it compares the npm dist-tags (latest / alpha) with
# the probes already committed; for each new version it downloads the official binary, runs
# scripts/compat-probe.mjs and commits the probe results. The publish job then signs the committed
# compat payload and hot-publishes it to data.cp.dev (KV; no Worker redeploy). A regression (a managed key vanished from the binary, or
# a Codex-Pass-shaped config.toml is rejected as a whole) opens an `ops` issue for human triage;
# the verdict goes into data/codex-compat/tracked.json (statusOverride/action) or advisories/.
on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Probe only this Codex version (empty = npm dist-tags latest + alpha)"
        required: false
      force:
        description: "Re-probe even if already probed (true/false)"
        required: false
        default: "false"
      publish:
        description: "Publish the committed compat payload even without new probe data (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write

concurrency:
  group: codexdata-compat-watch
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Probe new Codex versions
        id: probe
        run: |
          args=()
          [ -n "${{ inputs.version }}" ] && args+=(--version "${{ inputs.version }}")
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          set +e
          node scripts/compat-probe.mjs "${args[@]}" | tee probe.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # 0 = nothing new or all clear; 20 = regression found (still commit + publish so clients see the facts).
          [ "$status" = "0" ] || [ "$status" = "20" ] || exit "$status"
      - name: Rebuild compat payload
        run: node scripts/build-compat.mjs
      - name: Format probe data
        run: pnpm exec prettier --write data/codex-compat/probes
      - name: Commit probe results
        id: commit
        run: |
          git add data/codex-compat/probes public/v1/compat
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no new probe data"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(compat): probe new Codex versions"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update regression issue
        if: steps.probe.outputs.status == '20'
        run: |
          title="Codex compat regression detected"
          body=$(printf 'compat-probe found regressions at %s.\n\n```\n%s\n```\n\nTriage: confirm in data/codex-compat/tracked.json (statusOverride/action) or add an advisory, then re-run build-compat + publish.\n' \
            "$(date -u +%FT%TZ)" "$(grep -E 'probing|wrote|!!' probe.log | head -40)")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label "ops"
          fi

  # Signs and publishes the committed compat payload (docs/DATA-SIGNING.md). The signing key lives
  # only in the `data-signing` environment (deployment branch rule: `main`), so it stays out of the
  # probe job, which runs downloaded Codex binaries and `pnpm install`. This job runs neither: only
  # Node built-ins on a commit that must be on main.
  publish:
    needs: probe
    # `!cancelled()`: a probe job that pushed its commit and then failed later (for example while
    # opening the regression issue) still gets its data published, as before the split.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.probe.outputs.changed == 'true' || inputs.publish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: data-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.probe.outputs.sha || github.sha }}
          fetch-depth: 0
      - name: Refuse a commit that is not on main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "HEAD is not on main"; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
      - name: Sign and publish to data.cp.dev (KV hot update)
        env:
          CODEXDATA_ORIGIN: ${{ vars.CODEXDATA_ORIGIN || 'https://data.cp.dev' }}
          CODEXDATA_ADMIN_TOKEN: ${{ secrets.CODEXDATA_ADMIN_TOKEN }}
          DATA_SIGNING_KEY: ${{ secrets.DATA_SIGNING_KEY }}
        run: node scripts/publish-compat.mjs
