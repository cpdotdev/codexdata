name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The Codex tag sync dispatches CI on its bot branch (GITHUB_TOKEN pushes start no pull_request run).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      - name: Enable pnpm via corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Types + typecheck
        run: pnpm typecheck
      - name: Format check
        run: pnpm format:check
      - name: Data validation (schemas, registries, generated artifacts)
        run: pnpm validate
      - name: Tests (workers pool)
        run: pnpm test
      - name: Wrangler config dry run
        run: pnpm exec wrangler deploy --dry-run
